[project]
name = "realworld-py"
version = "0.1.0"
description = "Python FastAPI backend implementing the RealWorld API spec"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.135.1",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "mypy>=1.19.1",
]

[tool.ruff]
# Set the desired line length, defaults to 88 (same as Black).
line-length = 88

# Set the minimum Python version.
target-version = "py310"

# Exclude a variety of commonly ignored directories and files.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
# Enable specific rule sets.
# E (pycodestyle errors), F (Pyflakes), I (isort), UP (pyupgrade)
select = [
    "E",
    "F",
    "I",
    "UP",
]

# Ignore specific rules, for example, ignoring the line-too-long rule (E501).
ignore = [
    "E501",
]

# Allow fix for all enabled rules when running with --fix.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings (defaults to double).
quote-style = "double"

# Use spaces for indentation (defaults to space).
indent-style = "space"

# Use auto-detection for line endings.
line-ending = "auto"
